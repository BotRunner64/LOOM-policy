[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-policy"
version = "1.0.0"
description = "LOOM policy: per-segment Perceiver reader, shared transformer, direct action-chunk regression"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.24", "pyarrow>=15", "av>=12"]

[project.optional-dependencies]
dev = ["pytest>=8"]
rebot = ["rebot-policy-link>=0.1", "Pillow"]

[project.scripts]
loom-policy = "loom_policy.cli:main"

[tool.setuptools.packages.find]
include = ["loom_policy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
